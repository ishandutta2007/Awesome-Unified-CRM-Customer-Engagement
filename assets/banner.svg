<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filter for glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
      .orbit-path { fill: none; stroke: rgba(99, 102, 241, 0.18); stroke-dasharray: 6 6; }
      
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -200; }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pingDot {
        0% { r: 3; opacity: 1; }
        50% { r: 7; opacity: 0.4; }
        100% { r: 3; opacity: 1; }
      }

      .glow-blob-1 { animation: pulseGlow 8s infinite ease-in-out; transform-origin: 200px 100px; }
      .glow-blob-2 { animation: pulseGlow 10s infinite ease-in-out reverse; transform-origin: 1000px 300px; }
      .flow-stream { stroke-dasharray: 8 12; animation: flowDash 12s linear infinite; }
      .card-float-1 { animation: floatSlow 5s ease-in-out infinite; }
      .card-float-2 { animation: floatReverse 6s ease-in-out infinite; }
      .ping-1 { animation: pingDot 3s ease-in-out infinite; }
      .ping-2 { animation: pingDot 3.5s ease-in-out infinite 1s; }
      .ping-3 { animation: pingDot 4s ease-in-out infinite 0.5s; }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Nebula Lights in Background -->
  <circle class="glow-blob-1" cx="220" cy="110" r="180" fill="url(#glowGrad1)" filter="url(#glow)" />
  <circle class="glow-blob-2" cx="980" cy="310" r="210" fill="url(#glowGrad2)" filter="url(#glow)" />

  <!-- Geometric Grid Pattern -->
  <g class="bg-grid">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="500" y1="0" x2="500" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1100" y1="0" x2="1100" y2="420" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Dynamic Connecting Data Streams (Behind text) -->
  <g fill="none">
    <path class="flow-stream" d="M 50,330 C 250,370 350,70 600,100 C 850,130 950,50 1150,90" stroke="url(#lineGrad1)" stroke-width="2.5" />
    <path class="flow-stream" d="M 80,90 C 280,50 400,370 700,340 C 950,310 1020,380 1150,330" stroke="#a855f7" stroke-opacity="0.35" stroke-width="2" style="animation-duration: 9s;" />
  </g>

  <!-- Floating Dynamic Tech Cards / Pills (Background Layer) -->
  <!-- Left Side Badges -->
  <g class="card-float-1" opacity="0.85">
    <rect x="70" y="55" width="180" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="92" cy="76" r="6" fill="#38bdf8" class="ping-1" />
    <text x="110" y="81" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Omnichannel CRM ⚡</text>
  </g>

  <g class="card-float-2" opacity="0.85">
    <rect x="50" y="295" width="200" height="42" rx="21" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="72" cy="316" r="6" fill="#818cf8" class="ping-2" />
    <text x="90" y="321" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Marketing Automation 🎯</text>
  </g>

  <!-- Right Side Badges -->
  <g class="card-float-2" opacity="0.85">
    <rect x="940" y="65" width="190" height="42" rx="21" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="962" cy="86" r="6" fill="#ec4899" class="ping-3" />
    <text x="980" y="91" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">AI Agents &amp; Journeys 🤖</text>
  </g>

  <g class="card-float-1" opacity="0.85">
    <rect x="955" y="305" width="180" height="42" rx="21" fill="#1e293b" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="977" cy="326" r="6" fill="#10b981" class="ping-1" />
    <text x="995" y="331" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Open-Source &amp; Cloud 🚀</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (Guaranteed Clear & Fully Legible) -->
  <!-- Header Tag / Pill -->
  <g transform="translate(600, 115)">
    <rect x="-145" y="-18" width="290" height="34" rx="17" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="-120" cy="-1" r="5" fill="#22c55e" />
    <text x="5" y="5" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE &amp; OPEN SOURCE ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="190" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
    Awesome Unified CRM &amp; Customer Engagement
  </text>

  <!-- Subtitle -->
  <text x="600" y="234" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
    Curated guide to 360° Customer Relationship Management, Customer Data Platforms, and Lifecycle Journeys
  </text>

  <!-- Feature Pill Highlights -->
  <g transform="translate(600, 276)">
    <!-- Pill 1 -->
    <g transform="translate(-230, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📊 Market Leaders</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-75, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="rgba(129, 140, 248, 0.12)" stroke="#818cf8" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">💻 Self-Hosted OSS</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(85, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="rgba(192, 132, 252, 0.12)" stroke="#c084fc" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">💰 Pricing &amp; Limits</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(235, 0)">
      <rect x="-60" y="-14" width="120" height="28" rx="14" fill="rgba(244, 114, 182, 0.12)" stroke="#f472b6" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⭐ GitHub Stars</text>
    </g>
  </g>

  <!-- Interactive Decorative Bottom Border Wave -->
  <line x1="200" y1="365" x2="1000" y2="365" stroke="url(#titleGrad)" stroke-width="2" opacity="0.6" stroke-linecap="round" />
  <circle cx="600" cy="365" r="4" fill="#818cf8" />
</svg>